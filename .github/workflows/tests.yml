name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements/dev.txt -e .
      - run: npm ci && npm run build && npx playwright install --with-deps chromium && npm test
        working-directory: frontend
      - run: git diff --exit-code -- src/repairbench/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-browser-evidence
          path: frontend/test-results/
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements/dev.txt -e .
      - run: python -m pip check
      - run: python scripts/verify_evidence.py --revision HEAD
      - run: python scripts/verify_evidence.py
      - run: repair-bench data
      - run: mkdir -p runs && docker build -f docker/Dockerfile --iidfile runs/image.id .
      - run: python -m pytest -q --junitxml=runs/tests.xml
        env:
          REPAIR_IMAGE_FILE: runs/image.id
      - run: repair-bench evaluate --tasks gcd find_in_sorted --budget 12 --output runs/smoke
      - run: python -c "import json; r=json.load(open('runs/smoke/summary.json')); assert r['eligible_tasks']==2 and r['resolved_visible_tests']==1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-evidence
          path: runs/
  training-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements/dev.txt -r requirements/training.txt -e .
      - run: python -m pip check
      - run: python -m pytest tests/test_training.py tests/test_adaptation.py -m 'not docker' -q --junitxml=runs/training-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-control-evidence
          path: runs/training-tests.xml
